apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: tools
spec:
  rules:
    - host: grafana.nurcahyaari.lab.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000