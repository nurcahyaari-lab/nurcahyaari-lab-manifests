apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-env
  namespace: tools
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: homepage-env
    creationPolicy: Owner
  data:
    - secretKey: HOMEPAGE_VAR_PROXMOX_USER_ID
      remoteRef:
        key: prometheus_pve_user_id
    - secretKey: HOMEPAGE_VAR_PROXMOX_TOKEN
      remoteRef:
        key: prometheus_pve_token_value
    - secretKey: HOMEPAGE_VAR_GRAFANA_USERNAME
      remoteRef:
        key: grafana_username
    - secretKey: HOMEPAGE_VAR_GRAFANA_PASSWORD
      remoteRef:
        key: grafana_password