apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: tools
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.200
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: homepage
  ports:
    - port: 3000
      targetport: http
      protocol: TCP
      name: http