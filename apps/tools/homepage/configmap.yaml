apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: tools
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    favicon: https://raw.githubusercontent.com/nurcahyaari-lab/assets/7c6a3b11254e2161246adf592aaa03072ef042c9/favicon/homelab-icon.svg
    title: nurcahyaari-lab
    theme: dark
    color: slate
    headerStyle: boxed
    statusStyle: dot
    layout:
      Hypervisor:
        style: row
        columns: 1
      Cluster Management:
        style: row
        columns: 3
      Monitoring:
        style: row
        columns: 3
      Apps:
        style: row
        columns: 3
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/nurcahyaari-lab
  proxmox.yaml: |
    pve: # must match your actual Proxmox node name
      url: http://192.168.1.5:8006
      token: {{HOMEPAGE_VAR_PROXMOX_USER_ID}}
      secret: {{HOMEPAGE_VAR_PROXMOX_TOKEN}}
  services.yaml: |
    - Hypervisor:
        - Proxmox:
            icon: proxmox.png
            href: https://192.168.1.5:8006
            description: pve · the box everything runs on
            siteMonitor: https://192.168.1.5:8006
            widget:
              type: proxmox
              url: "https://192.168.1.5:8006"
              username: "{{HOMEPAGE_VAR_PROXMOX_USER_ID}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"

    # "Cluster Management" is the same group the Homepage ingress
    # annotation uses, so the auto-discovered Homepage card lands here too
    - Cluster Management:
        - k8s-cp:
            icon: kubernetes.png
            description: control plane · 192.168.1.21
            ping: 192.168.1.21
        - k8s-worker:
            icon: kubernetes.png
            description: worker · 192.168.1.22
            ping: 192.168.1.22

    - Monitoring:
        - Grafana:
            icon: grafana.png
            href: http://192.168.1.23:3000
            description: dashboards
            siteMonitor: http://192.168.1.23:3000
            widget:
              type: grafana
              version: 2 # optional, default is 1
              alerts: alertmanager # optional, default is grafana
              url: "http://192.168.1.23:3000"
              username: "{{HOMEPAGE_VAR_GRAFANA_USERNAME}}"
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
        - Prometheus:
            icon: prometheus.png
            href: http://192.168.1.23:9090/targets
            description: metrics · monitoring VM
            siteMonitor: http://192.168.1.23:9090
            widget:
              type: prometheus
              url: http://192.168.1.23:9090
        - Alertmanager:
            icon: alertmanager.png
            href: http://192.168.1.23:9093
            description: alerts
            siteMonitor: http://192.168.1.23:9093

    - Apps:
        - podinfo:
            icon: si-go
            description: demo app for testing deploys
            siteMonitor: "http://podinfo.tools.svc.cluster.local"
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""