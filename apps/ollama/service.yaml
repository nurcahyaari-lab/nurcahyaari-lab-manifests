apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ollama
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
  - protocol: TCP
    port: 11434
    targetPort: 11434
---
apiVersion: v1
kind: Service
metadata:
  name: openweb-ui
  namespace: ollama
spec:
  selector:
    app: openweb-ui
  ports:
    - port: 8080
      targetPort: 8080