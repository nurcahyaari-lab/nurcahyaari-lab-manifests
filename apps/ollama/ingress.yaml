apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openweb-ui
  namespace: ollama
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Chat
    gethomepage.dev/description: Open WebUI · local LLMs via Ollama
    gethomepage.dev/group: Apps
    gethomepage.dev/icon: open-webui.png
    gethomepage.dev/pod-selector: app=open-webui
spec:
  rules:
    - host: chat.nurcahyaari.lab.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openweb-ui
                port:
                  number: 8080