apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - cluster-role.yaml
  - cluster-role-binding.yaml
  - service-account.yaml
  - deployment.yaml
  - service.yaml
  - nodeport-service.yaml

patches:
  - target:
      kind: Deployment
      name: kube-tate-metrics
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kube-state-metrics
      spec:
        template:
          spec:
            nodeSelector:
              node-role.kubernetes.io/control-plane: ""
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
            containers:
              - name: kube-state-metrics
                resources:
                  requests:
                    cpu: 10m
                    memory: 64Mi
                  limits:
                    memory: 192Mi