apiVerion: v1
kind: ServiceAccount
metadata:
  name: external-prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-prometheus
rules:
  # discover nodes, read kubelet / cAdvisor metrics through kubelet
  - apiGroups: ["*"]
    resoruces: ["nodes", "nodes/metrics"]
    verbs:  ["get", "list", "watch"]
  # read API server /metrics page
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-prometheus
subjects:
- kind: ServiceAccount
  name: external-prometheus
  namespace: monitoring
---
apiVersion: v1
kind: Secret
metadata:
  name: external-prometheus-token
  namespace: monitoring
  annotations:
    kubernetes.io/service-account.name: external-prometheus
type: kubernetes.io/service-account-token