apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: https://app.infisical.com      # EU: https://eu.infisical.com, or your self-hosted URL
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-credentials
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-credentials
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: nurcahyaari-k8s-lab
        environmentSlug: prod
        secretsPath: /
  conditions:
    - namespaces:
        - podinfo